name: Supabase Migration Replay

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "database/schema.sql"
      - ".github/workflows/supabase-migration-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: Replay all local migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install Node.js dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Initialize local Supabase configuration
        run: supabase init

      - name: Prepare local-only legacy baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="supabase/migrations/00000000000000_local_ci_baseline.sql"
          cp supabase/ci-legacy-baseline.sql "$baseline"
          # The committed snapshot is sourced from 2396d45^, immediately
          # before Notification Phase 1. It must not contain Phase 1 objects.
          if grep -Eq "notification_events|reminders_owner_edit|reminders_guard_update|sync_reminder_notification_events" "$baseline"; then
            echo "The legacy baseline contains Notification Phase 1 objects" >&2
            exit 1
          fi
          grep -Fq "create table public.reminders" "$baseline"

      - name: Start local Supabase services
        run: >-
          supabase start
          --exclude studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Replay every migration on a clean local database
        run: supabase db reset --local --no-seed

      - name: Verify migration history, schema, RLS, and effective privileges
        shell: bash
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail

          for migration in supabase/migrations/20*.sql; do
            version="$(basename "$migration" | cut -d_ -f1)"
            [[ "$version" =~ ^[0-9]{14}$ ]]
            applied="$(psql "$LOCAL_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 \
              -c "select count(*) from supabase_migrations.schema_migrations where version = '$version';")"
            test "$applied" = "1"
          done

          psql "$LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            actual_default text;
            actual_labels text[];
          begin
            if not exists (
              select 1
              from pg_catalog.pg_attribute attribute
              join pg_catalog.pg_class relation
                on relation.oid = attribute.attrelid
              join pg_catalog.pg_namespace namespace
                on namespace.oid = relation.relnamespace
              join pg_catalog.pg_type data_type
                on data_type.oid = attribute.atttypid
              join pg_catalog.pg_namespace type_namespace
                on type_namespace.oid = data_type.typnamespace
              where namespace.nspname = 'public'
                and relation.relname = 'reminders'
                and attribute.attname = 'status'
                and attribute.attnum > 0
                and not attribute.attisdropped
                and type_namespace.nspname = 'public'
                and data_type.typname = 'reminder_status'
            ) then
              raise exception 'reminders.status is not public.reminder_status';
            end if;

            select array_agg(enum.enumlabel order by enum.enumsortorder)
              into actual_labels
            from pg_catalog.pg_enum enum
            where enum.enumtypid = 'public.reminder_status'::regtype;

            if actual_labels is distinct from array['Upcoming', 'Completed']::text[] then
              raise exception 'Unexpected reminder_status labels: %', actual_labels;
            end if;

            select pg_catalog.pg_get_expr(default_value.adbin, default_value.adrelid)
              into actual_default
            from pg_catalog.pg_attrdef default_value
            join pg_catalog.pg_attribute attribute
              on attribute.attrelid = default_value.adrelid
             and attribute.attnum = default_value.adnum
            where default_value.adrelid = 'public.reminders'::regclass
              and attribute.attname = 'status';

            if actual_default is null
               or actual_default not like '%Upcoming%reminder_status%' then
              raise exception 'Unexpected reminders.status default: %', actual_default;
            end if;

            if not exists (
              select 1
              from pg_catalog.pg_policy policy
              where policy.polrelid = 'public.reminders'::regclass
                and policy.polname = 'reminders_owner_update'
                and policy.polcmd = 'w'
            ) then
              raise exception 'reminders_owner_update policy is missing after replay';
            end if;

            if not has_table_privilege(
              'authenticated',
              'public.medical_records',
              'DELETE'
            ) then
              raise exception 'authenticated is missing DELETE on medical_records';
            end if;

            if has_table_privilege('anon', 'public.medical_records', 'DELETE') then
              raise exception 'anon unexpectedly has DELETE on medical_records';
            end if;

            if not has_table_privilege('authenticated', 'public.health_logs', 'SELECT')
               or not has_table_privilege('authenticated', 'public.health_logs', 'INSERT') then
              raise exception 'authenticated is missing SELECT or INSERT on health_logs';
            end if;

            if has_table_privilege('authenticated', 'public.health_logs', 'UPDATE')
               or not has_table_privilege('authenticated', 'public.health_logs', 'DELETE')
               or has_table_privilege('authenticated', 'public.health_logs', 'TRUNCATE')
               or has_table_privilege('authenticated', 'public.health_logs', 'REFERENCES')
               or has_table_privilege('authenticated', 'public.health_logs', 'TRIGGER')
               or has_table_privilege('authenticated', 'public.health_logs', 'MAINTAIN') then
              raise exception 'authenticated has unexpected health_logs table privileges';
            end if;

            if exists (
              select 1
              from (values
                ('health_log_id'::text), ('created_by'), ('pet_id'), ('logged_at')
              ) immutable_column(column_name)
              where has_column_privilege(
                'authenticated',
                'public.health_logs',
                immutable_column.column_name,
                'UPDATE'
              )
            ) then
              raise exception 'authenticated can UPDATE immutable health_logs columns';
            end if;

            if exists (
              select 1
              from (values
                ('recorded_on'::text), ('weight'), ('food_amount'), ('food_type'), ('status'), ('note')
              ) editable_column(column_name)
              where not has_column_privilege(
                'authenticated',
                'public.health_logs',
                editable_column.column_name,
                'UPDATE'
              )
            ) then
              raise exception 'authenticated is missing an editable health_logs column privilege';
            end if;

            if has_table_privilege('anon', 'public.health_logs', 'SELECT')
               or has_table_privilege('anon', 'public.health_logs', 'INSERT')
               or has_table_privilege('anon', 'public.health_logs', 'UPDATE')
               or has_table_privilege('anon', 'public.health_logs', 'DELETE')
               or has_table_privilege('anon', 'public.health_logs', 'TRUNCATE')
               or has_table_privilege('anon', 'public.health_logs', 'REFERENCES')
               or has_table_privilege('anon', 'public.health_logs', 'TRIGGER')
               or has_table_privilege('anon', 'public.health_logs', 'MAINTAIN') then
              raise exception 'anon unexpectedly has a health_logs privilege';
            end if;

            if not has_table_privilege('authenticated', 'public.reminders', 'SELECT')
               or not has_table_privilege('authenticated', 'public.reminders', 'INSERT') then
              raise exception 'Authenticated is missing SELECT or INSERT on reminders';
            end if;

            if exists (
              select 1
              from information_schema.role_table_grants table_grant
              where table_grant.grantee = 'authenticated'
                and table_grant.table_schema = 'public'
                and table_grant.table_name = 'reminders'
                and table_grant.privilege_type in (
                  'UPDATE',
                  'DELETE',
                  'TRUNCATE',
                  'REFERENCES',
                  'TRIGGER'
                )
            ) then
              raise exception 'Unexpected authenticated table-level privilege on reminders';
            end if;

            if not has_column_privilege(
              'authenticated',
              'public.reminders',
              'status',
              'UPDATE'
            ) or not has_column_privilege(
              'authenticated',
              'public.reminders',
              'completed_at',
              'UPDATE'
            ) then
              raise exception 'Reminder completion columns are missing UPDATE';
            end if;

            if exists (
              select 1
              from information_schema.columns column_info
              where column_info.table_schema = 'public'
                and column_info.table_name = 'reminders'
                and column_info.column_name not in (
                  'status', 'completed_at', 'due_date', 'note'
                )
                and has_column_privilege(
                  'authenticated',
                  'public.reminders',
                  column_info.column_name,
                  'UPDATE'
                )
            ) then
              raise exception 'Authenticated can UPDATE an unexpected Reminder column';
            end if;

            if not has_column_privilege('authenticated', 'public.reminders', 'due_date', 'UPDATE')
               or not has_column_privilege('authenticated', 'public.reminders', 'note', 'UPDATE')
               then
              raise exception 'Reminder edit columns are missing UPDATE';
            end if;
            if has_column_privilege('authenticated', 'public.reminders', 'updated_at', 'UPDATE') then
              raise exception 'updated_at must not be client writable';
            end if;

            if exists (
              select 1
              from information_schema.columns column_info
              where column_info.table_schema = 'public'
                and column_info.table_name = 'reminders'
                and (
                  not has_column_privilege(
                    'authenticated',
                    'public.reminders',
                    column_info.column_name,
                    'SELECT'
                  )
                  or not has_column_privilege(
                    'authenticated',
                    'public.reminders',
                    column_info.column_name,
                    'INSERT'
                  )
                  or has_column_privilege(
                    'authenticated',
                    'public.reminders',
                    column_info.column_name,
                    'REFERENCES'
                  )
                )
            ) then
              raise exception 'Unexpected authenticated column privilege on reminders';
            end if;

            if exists (
              select 1
              from information_schema.columns column_info
              where column_info.table_schema = 'public'
                and column_info.table_name = 'reminders'
                and (
                  has_column_privilege('anon', 'public.reminders', column_info.column_name, 'SELECT')
                  or has_column_privilege('anon', 'public.reminders', column_info.column_name, 'INSERT')
                  or has_column_privilege('anon', 'public.reminders', column_info.column_name, 'UPDATE')
                  or has_column_privilege('anon', 'public.reminders', column_info.column_name, 'REFERENCES')
                )
            ) then
              raise exception 'anon unexpectedly has a Reminder column privilege';
            end if;

            if exists (
              select 1
              from (values
                ('medical_records'::text, 'medical_records_owner_delete'::text, 'd'::"char"),
                ('health_logs', 'health_logs_owner_select', 'r'::"char"),
                ('health_logs', 'health_logs_owner_insert', 'a'::"char"),
                ('health_logs', 'health_logs_owner_update', 'w'::"char"),
                ('health_logs', 'health_logs_owner_delete', 'd'::"char"),
                ('vaccine_records', 'vaccine_records_owner_delete', 'd'::"char"),
                ('reminders', 'reminders_owner_select', 'r'::"char"),
                ('reminders', 'reminders_owner_insert', 'a'::"char"),
                ('reminders', 'reminders_owner_update', 'w'::"char")
              ) expected_policy(table_name, policy_name, command)
              where not exists (
                select 1
                from pg_catalog.pg_policy policy
                where policy.polrelid = format(
                  'public.%I',
                  expected_policy.table_name
                )::regclass
                  and policy.polname = expected_policy.policy_name
                  and policy.polcmd = expected_policy.command
              )
            ) then
              raise exception 'An expected Owner RLS policy is missing after replay';
            end if;

            if not exists (select 1 from pg_catalog.pg_policy where polrelid = 'public.notification_events'::regclass and polname = 'notification_events_owner_select')
               or not exists (select 1 from pg_catalog.pg_policy where polrelid = 'public.notification_events'::regclass and polname = 'notification_events_owner_read_update') then
              raise exception 'Notification Owner policies are missing';
            end if;
            if not has_table_privilege('authenticated', 'public.notification_events', 'SELECT')
               or has_table_privilege('authenticated', 'public.notification_events', 'INSERT')
               or has_table_privilege('authenticated', 'public.notification_events', 'DELETE') then
              raise exception 'Unexpected notification_events table privileges';
            end if;
            if not has_column_privilege('authenticated', 'public.notification_events', 'read_at', 'UPDATE')
               or has_column_privilege('authenticated', 'public.notification_events', 'scheduled_for', 'UPDATE') then
              raise exception 'Unexpected notification_events column privileges';
            end if;
            if not exists (select 1 from pg_trigger where tgrelid = 'public.reminders'::regclass and tgname = 'reminders_sync_notification_events' and not tgisinternal) then
              raise exception 'Reminder notification trigger is missing';
            end if;
            if not exists (select 1 from pg_trigger where tgrelid = 'public.reminders'::regclass and tgname = 'reminders_guard_update' and not tgisinternal) then
              raise exception 'Reminder guard trigger is missing';
            end if;

            if not exists (
              select 1
              from storage.buckets
              where id = 'pet-photos'
                and public = false
                and file_size_limit = 5242880
            ) then
              raise exception 'pet-photos bucket is not private or has the wrong size limit';
            end if;
            if not exists (
              select 1 from pg_policies
              where schemaname = 'storage'
                and tablename = 'objects'
                and policyname = 'pet_photos_owner_select'
            ) or not exists (
              select 1 from pg_policies
              where schemaname = 'storage'
                and tablename = 'objects'
                and policyname = 'pet_photos_owner_insert'
            ) or not exists (
              select 1 from pg_policies
              where schemaname = 'storage'
                and tablename = 'objects'
                and policyname = 'pet_photos_owner_delete'
            ) then
              raise exception 'pet-photos Owner storage policies are missing';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_schema = 'public'
                and table_name = 'pets'
                and column_name = 'creation_key'
            ) or not exists (
              select 1 from information_schema.columns
              where table_schema = 'public'
                and table_name = 'pets'
                and column_name = 'creation_payload_hash'
            ) then
              raise exception 'Pet idempotency columns are missing';
            end if;
          end
          $$;
          SQL

      - name: Verify notification database behavior
        shell: bash
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          insert into auth.users (id, email, encrypted_password, email_confirmed_at, raw_app_meta_data, raw_user_meta_data)
          values ('00000000-0000-0000-0000-000000000091', 'notification-ci@example.com', 'not-used', now(), '{"provider":"email"}', '{}');
          insert into public.pets (pet_id, owner_id, name, species, gender)
          values ('00000000-0000-0000-0000-000000000092', '00000000-0000-0000-0000-000000000091', 'Notification CI', 'Cat', 'Unknown');

          insert into public.reminders (reminder_id, user_id, pet_id, due_date, type)
          values ('00000000-0000-0000-0000-000000000093', '00000000-0000-0000-0000-000000000091', '00000000-0000-0000-0000-000000000092', current_date + 5, 'Other');

          do $$
          declare
            event_count integer;
            due_soon_schedule timestamptz;
            overdue_schedule timestamptz;
          begin
            select count(*) into event_count from public.notification_events where reminder_id = '00000000-0000-0000-0000-000000000093';
            if event_count <> 2 then raise exception 'Upcoming reminder did not create exactly two events'; end if;
            select scheduled_for into due_soon_schedule from public.notification_events where reminder_id = '00000000-0000-0000-0000-000000000093' and event_type = 'due_soon' and cancelled_at is null;
            select scheduled_for into overdue_schedule from public.notification_events where reminder_id = '00000000-0000-0000-0000-000000000093' and event_type = 'overdue' and cancelled_at is null;
            if due_soon_schedule <> ((current_date + 3) + time '08:00') at time zone 'Asia/Ho_Chi_Minh' then raise exception 'due_soon schedule is incorrect'; end if;
            if overdue_schedule <> ((current_date + 7) + time '08:00') at time zone 'Asia/Ho_Chi_Minh' then raise exception 'overdue schedule is incorrect'; end if;
          end $$;

          update public.reminders set due_date = current_date + 10 where reminder_id = '00000000-0000-0000-0000-000000000093';
          do $$
          begin
            if (select count(*) from public.notification_events where reminder_id = '00000000-0000-0000-0000-000000000093' and cancelled_at is null) <> 2
               or (select count(*) from public.notification_events where reminder_id = '00000000-0000-0000-0000-000000000093' and cancelled_at is not null) <> 2 then
              raise exception 'Reschedule did not cancel old events and create one active pair';
            end if;
          end $$;

          update public.reminders set status = 'Completed', completed_at = now() where reminder_id = '00000000-0000-0000-0000-000000000093';
          do $$
          begin
            if (select count(*) from public.notification_events where reminder_id = '00000000-0000-0000-0000-000000000093' and cancelled_at is null) <> 0 then
              raise exception 'Completion left active notification events';
            end if;
          end $$;

          insert into public.reminders (reminder_id, user_id, pet_id, due_date, type)
          values ('00000000-0000-0000-0000-000000000094', '00000000-0000-0000-0000-000000000091', '00000000-0000-0000-0000-000000000092', current_date + 5, 'Other');
          do $$
          begin
            begin
              update public.reminders
              set status = 'Completed', completed_at = now(), due_date = current_date + 6
              where reminder_id = '00000000-0000-0000-0000-000000000094';
              raise exception 'Mixed Edit and Complete update was accepted';
            exception when others then
              if SQLERRM not like '%Completion may only change status and completed_at%' then raise; end if;
            end;
          end $$;

          rollback;
          SQL

      - name: Run notification selector regression test
        run: npm run test:notifications

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
